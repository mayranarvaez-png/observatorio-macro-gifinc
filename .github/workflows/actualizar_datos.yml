# Actualiza los datos todos los días hábiles y los guarda en el repositorio.
# Streamlit Community Cloud redespliega la app automáticamente con cada commit.
name: Actualizar datos

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 7:00 a. m. hora Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Descargar series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python actualizar_datos.py || echo "Algunas fuentes fallaron; se conservan los datos previos."
      - name: Actualizar lista de acciones de EE. UU.
        run: python actualizar_universo.py || echo "No se pudo actualizar la lista de acciones; se conserva la anterior."
      - name: Guardar cambios
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Actualización automática de datos $(date +%F)"
          git push
